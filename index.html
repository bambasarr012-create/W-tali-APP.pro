    function calculatePointsCommuns(myProfile, targetProfile) {
      if (!targetProfile) return { score: 75, points: [] };
      const points = [];
      let score = 65;

      if (myProfile?.ville && targetProfile?.ville) {
        if (myProfile.ville.trim().toLowerCase() === targetProfile.ville.trim().toLowerCase()) {
          points.push(`Même ville de résidence (${targetProfile.ville})`);
          score += 15;
        }
      }

      if (myProfile?.dahira && targetProfile?.dahira) {
        if (myProfile.dahira === targetProfile.dahira && myProfile.dahira !== 'Autre Dahira') {
          points.push(`Même repère spirituel (${targetProfile.dahira})`);
          score += 12;
        }
      }

      if (myProfile?.visionMariage && targetProfile?.visionMariage) {
        if (myProfile.visionMariage === targetProfile.visionMariage) {
          points.push(`Vision d'engagement alignée (${targetProfile.visionMariageLabel || 'Identique'})`);
          score += 10;
        }
      }

      const myInterests = Array.isArray(myProfile?.interets) ? myProfile.interets : [];
      const targetInterests = Array.isArray(targetProfile?.interets) ? targetProfile.interets : [];
      const shared = myInterests.filter(i => targetInterests.includes(i));
      if (shared.length > 0) {
        points.push(`${shared.length} centre(s) d'intérêt en commun : ${shared.join(', ')}`);
        score += Math.min(shared.length * 4, 12);
      }

      if (myProfile?.age && targetProfile?.age) {
        const diff = Math.abs(myProfile.age - targetProfile.age);
        if (diff <= 5) {
          points.push(`Tranche d'âge très harmonieuse (écart de ${diff} an${diff > 1 ? 's' : ''})`);
          score += 6;
        }
      }

      if (points.length === 0) {
        points.push("Engagement envers les valeurs de la Teranga & profil vérifié");
      }

      return { score: Math.min(score, 99), points };
    }

    const AppContext = createContext(null);

    function AppProvider({ children }) {
      const [user, setUser] = useState(() => {
        try {
          const raw = localStorage.getItem('wetali_auth_user');
          return raw ? JSON.parse(raw) : null;
        } catch (e) { return null; }
      });

      const [userProfile, setUserProfile] = useState(() => {
        try {
          const raw = localStorage.getItem('wetali_current_profile');
          return raw ? JSON.parse(raw) : null;
        } catch (e) { return null; }
      });

      const [currentView, setCurrentView] = useState('home'); // 'home' | 'matches' | 'requests' | 'chat' | 'settings' | 'profile-create' | 'profile-detail'
      const [selectedProfile, setSelectedProfile] = useState(null);
      const [activeMatch, setActiveMatch] = useState(null);
      const [toast, setToast] = useState(null);

      const [pendingRequestsCount, setPendingRequestsCount] = useState(2);
      const [matchesCount, setMatchesCount] = useState(1);
      const [requestModalState, setRequestModalState] = useState({ isOpen: false, targetProfile: null });

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3800);
      };

      const refreshCounts = () => {
        try {
          const rawReqs = localStorage.getItem('wetali_requests');
          const reqs = rawReqs ? JSON.parse(rawReqs) : [];
          setPendingRequestsCount(reqs.filter(r => r.status === 'pending' && r.toUserId === 'current_user').length);

          const rawMatches = localStorage.getItem('wetali_matches');
          const matches = rawMatches ? JSON.parse(rawMatches) : [];
          setMatchesCount(matches.length);
        } catch (e) { console.error(e); }
      };

      useEffect(() => {
        refreshCounts();
      }, [userProfile]);

      const login = (email, password) => {
        const u = { uid: "current_user", email: email.toLowerCase(), hasCompletedProfile: !!userProfile };
        setUser(u);
        localStorage.setItem('wetali_auth_user', JSON.stringify(u));
        return u;
      };

      const signup = (email, password) => {
        const u = { uid: `user_${Date.now()}`, email: email.toLowerCase(), hasCompletedProfile: false };
        setUser(u);
        localStorage.setItem('wetali_auth_user', JSON.stringify(u));
        return u;
      };

      const logout = () => {
        localStorage.removeItem('wetali_auth_user');
        setUser(null);
      };

      const updateProfile = (profileData) => {
        setUserProfile(profileData);
        localStorage.setItem('wetali_current_profile', JSON.stringify(profileData));
        if (user) {
          const u = { ...user, hasCompletedProfile: true };
          setUser(u);
          localStorage.setItem('wetali_auth_user', JSON.stringify(u));
        }
      };

      const viewProfileDetail = (p) => {
        setSelectedProfile(p);
        setCurrentView('profile-detail');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const openChatWithMatch = (match) => {
        setActiveMatch(match);
        setCurrentView('chat');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <AppContext.Provider value={{
          user,
          userProfile,
          login,
          signup,
          logout,
          updateProfile,
          currentView,
          setCurrentView,
          selectedProfile,
          viewProfileDetail,
          activeMatch,
          openChatWithMatch,
          pendingRequestsCount,
          matchesCount,
          requestModalState,
          setRequestModalState,
          toast,
          showToast,
          refreshCounts
        }}>
          {children}
        </AppContext.Provider>
      );
    }

    function useApp() {
      return useContext(AppContext);
    }

            {svgEl}
          </div>

    // ============================================================
    function AuthPage() {
      const { login, signup, showToast, setCurrentView } = useApp();
      const [mode, setMode] = useState('login');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [error, setError] = useState('');
      const [forgotSuccess, setForgotSuccess] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        setError('');

        if (mode === 'signup') {
          if (password !== confirmPassword) {
            setError("Les mots de passe ne correspondent pas.");
            return;
          }
          if (password.length < 6) {
            setError("Le mot de passe doit comporter au moins 6 caractères.");
            return;
          }
          signup(email, password);
          showToast("Compte créé avec succès ! Veuillez compléter votre profil.", "success");
          setCurrentView('profile-create');
        } else if (mode === 'login') {
          const u = login(email, password);
          showToast("Connexion réussie ! Bienvenue sur Wétali.", "success");
          setCurrentView(u.hasCompletedProfile ? 'home' : 'profile-create');
        } else if (mode === 'forgot') {
          setForgotSuccess(true);
          showToast(`Lien de réinitialisation envoyé à ${email}`, "success");
        }
      };

      const handleFastDemo = () => {
        login('amadou.diaspora@example.com', 'wetali2026');
        showToast("Connecté avec le profil démo Diaspora !", "success");
        setCurrentView('home');
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-[#0A2F4A] via-[#0E3B5C] to-[#061C2C] text-white flex flex-col justify-center items-center px-4 py-12 relative overflow-hidden">
          <div className="w-full max-w-md bg-white text-slate-800 rounded-3xl p-8 sm:p-10 shadow-2xl relative z-10 border border-slate-100">
            
            {/* Logo */}
            <div className="text-center space-y-3 mb-8 flex flex-col items-center">
              <WeddingRingLogo size="xl" />
              <div>
                <h1 className="font-serif font-bold text-2xl sm:text-3xl text-[#0A2F4A]">
                  Wétali Matrimonial
                </h1>
                <p className="text-xs text-slate-500 font-medium mt-1">
                  Réseau d'Unions d'Honneur pour la Diaspora Sénégalaise
                </p>
              </div>
            </div>

            {/* Switch Mode */}
            <div className="flex bg-[#F0F4F2] p-1 rounded-2xl mb-6 border border-slate-200">
              <button
                type="button"
                onClick={() => { setMode('login'); setError(''); setForgotSuccess(false); }}
                className={`w-1/2 py-2.5 rounded-xl font-bold text-xs transition-all ${
                  mode === 'login' ? 'bg-white text-[#0A2F4A] shadow-sm' : 'text-slate-600'
                }`}
              >
                Se Connecter
              </button>
              <button
                type="button"
                onClick={() => { setMode('signup'); setError(''); setForgotSuccess(false); }}
                className={`w-1/2 py-2.5 rounded-xl font-bold text-xs transition-all ${
                  mode === 'signup' ? 'bg-white text-[#2D8659] shadow-sm' : 'text-slate-600'

                Créer un Compte

            </div>

            {error && (
              <div className="mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl font-medium">
                ⚠️ {error}
              </div>
            )}

            {mode === 'forgot' && forgotSuccess ? (
              <div className="text-center py-6 space-y-3">
                <div className="w-12 h-12 rounded-full bg-[#EAF5EF] text-[#2D8659] mx-auto flex items-center justify-center font-bold text-lg">
                  ✓
                </div>
                <h3 className="font-bold text-[#0A2F4A]">Email envoyé</h3>
                <p className="text-xs text-slate-600">Consultez votre messagerie pour continuer.</p>

                  />

                {mode !== 'forgot' && (

                    <input

            {/* Quick 1-click Demo */}
            <div className="mt-8 pt-6 border-t border-slate-100 text-center">
              <button
                type="button"
                onClick={handleFastDemo}
                className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-[#F0F4F2] hover:bg-[#E2EBE6] text-[#2D8659] text-xs font-bold transition-all border border-[#2D8659]/20"
              >
                <span>✨ Accès Démo 1-Clic (Diaspora)</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // COMPONENT: PROFILE CREATION
    // ============================================================
    function ProfileCreation({ isEditing = false, onComplete }) {
      const { user, userProfile, updateProfile, showToast, setCurrentView } = useApp();

      const [formData, setFormData] = useState({
        prenom: userProfile?.prenom || '',
        nom: userProfile?.nom || '',
        age: userProfile?.age || '',
        genre: userProfile?.genre || 'H',
        ville: userProfile?.ville || '',
        pays: userProfile?.pays || 'France',
        email: userProfile?.email || user?.email || '',
        telephone: userProfile?.telephone || '',
        profession: userProfile?.profession || '',
        visionMariage: userProfile?.visionMariage || 'court_terme',
        etudes: userProfile?.etudes || '',
        ecole: userProfile?.ecole || '',
        dahira: userProfile?.dahira || 'Touba Mouride',
        bio: userProfile?.bio || '',
        interets: userProfile?.interets || ['Spiritualité', 'Cuisine sénégalaise', 'Entrepreneuriat'],
        photos: userProfile?.photos || [
          'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=800&q=80'
        ]
      });

      const handlePhotoUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (formData.photos.length >= 5) {
          showToast("Maximum 5 photos autorisées.", "error");
          return;
        }
        const reader = new FileReader();
        reader.onload = (event) => {
          setFormData(prev => ({ ...prev, photos: [...prev.photos, event.target.result] }));
          showToast("Photo ajoutée !", "success");
        };
        reader.readAsDataURL(file);
      };

      const removePhoto = (idx) => {
        if (formData.photos.length <= 1) {
          showToast("Conservez au moins 1 photo.", "error");
          return;
        }
        setFormData(prev => ({ ...prev, photos: prev.photos.filter((_, i) => i !== idx) }));
      };

      const toggleInterest = (tag) => {
        if (formData.interets.includes(tag)) {
          setFormData(prev => ({ ...prev, interets: prev.interets.filter(t => t !== tag) }));
        } else {
          if (formData.interets.length >= 5) {
            showToast("Maximum 5 centres d'intérêt.", "error");
            return;
          }
          setFormData(prev => ({ ...prev, interets: [...prev.interets, tag] }));
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.prenom || !formData.age || !formData.ville || !formData.telephone || !formData.profession) {
          showToast("Veuillez remplir tous les champs obligatoires (*).", "error");
          return;
        }

        const selectedVision = VISION_MARIAGE_OPTIONS.find(v => v.value === formData.visionMariage);
        const profileToSave = {
          ...formData,
          id: userProfile?.id || user?.uid || 'current_user',
          age: parseInt(formData.age, 10),
          visionMariageLabel: selectedVision ? selectedVision.label : formData.visionMariage,
          verified: true
        };

        updateProfile(profileToSave);
        showToast(isEditing ? "Profil mis à jour !" : "Profil créé avec succès !", "success");
        if (onComplete) onComplete();
        else setCurrentView('home');
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-8 pb-24 space-y-6">
          <div className="bg-[#0A2F4A] text-white p-6 sm:p-8 rounded-3xl shadow-lg">
            <h1 className="font-serif font-bold text-2xl sm:text-3xl">
              {isEditing ? "Édition du Profil Matrimonial" : "Création de Profil Matrimonial"}
            </h1>
            <p className="text-xs sm:text-sm text-[#A0C0D6] mt-1">
              Remplissez vos critères pour permettre des mises en relation d'honneur.
            </p>
          </div>

          <form onSubmit={handleSubmit} className="space-y-6">
            
            {/* Photos */}
            <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-3">
              <div className="flex justify-between items-center border-b pb-2">
                <h2 className="font-bold text-sm text-[#0A2F4A]">Photos de profil (1 à 5) *</h2>
                <span className="text-xs font-mono font-bold text-[#2D8659] bg-[#EAF5EF] px-2 py-0.5 rounded-full">
                  {formData.photos.length}/5
                </span>
              </div>

              <div className="grid grid-cols-3 sm:grid-cols-5 gap-3 pt-2">
                {formData.photos.map((p, idx) => (
                  <div key={idx} className="relative rounded-2xl overflow-hidden aspect-square border-2 border-slate-200">
                    <img src={p} alt="Aperçu" className="w-full h-full object-cover" />
                    {idx === 0 && (
                      <span className="absolute bottom-1 left-1 bg-[#2D8659] text-white text-[9px] font-bold px-1.5 py-0.5 rounded">
                        Principale
                      </span>
                    )}
                    <button
                      type="button"
                      onClick={() => removePhoto(idx)}
                      className="absolute top-1 right-1 p-1 rounded-full bg-rose-600 text-white text-xs"
                    >
                      ✕
                    </button>
                  </div>
                ))}

                {formData.photos.length < 5 && (
                  <label className="border-2 border-dashed border-slate-300 hover:border-[#2D8659] rounded-2xl flex flex-col items-center justify-center p-3 cursor-pointer aspect-square text-center">
                    <span className="text-xl text-[#2D8659] font-bold">+</span>
                    <span className="text-[10px] text-slate-500">Ajouter</span>
                    <input type="file" accept="image/*" onChange={handlePhotoUpload} className="hidden" />
                  </label>
                )}
              </div>
            </div>

            {/* Obligatoires */}
            <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
              <h2 className="font-bold text-sm text-[#0A2F4A] border-b pb-2">Informations Obligatoires *</h2>
              
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-[#0A2F4A] uppercase mb-1">Prénom *</label>
                  <input
                    type="text"
                    required
                    value={formData.prenom}
                    onChange={(e) => setFormData({ ...formData, prenom: e.target.value })}

                    className="w-full p-2.5 rounded-xl border border-slate-300 text-sm focus:border-[#2D8659] outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-[#0A2F4A] uppercase mb-1">Âge *</label>
                  <input
                    type="number"

                    max="80"
                    value={formData.age}
                    onChange={(e) => setFormData({ ...formData, age: e.target.value })}
                    placeholder="Ex: 29"
                    className="w-full p-2.5 rounded-xl border border-slate-300 text-sm focus:border-[#2D8659] outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-[#0A2F4A] uppercase mb-1">Genre *</label>
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      type="button"
                      onClick={() => setFormData({ ...formData, genre: 'H' })}
                      className={`py-2 rounded-xl text-xs font-bold border ${formData.genre === 'H' ? 'bg-[#0A2F4A] text-white' : 'bg-white text-slate-700'}`}
                    >
                      Homme

                      className={`py-2 rounded-xl text-xs font-bold border ${formData.genre === 'F' ? 'bg-[#2D8659] text-white' : 'bg-white text-slate-700'}`}
                    >

                  </div>

                  <input
                    type="text"

    // ============================================================
    // COMPONENT: HOME PAGE (FILTERS + GRID)
    // ============================================================
    function HomePage() {
      const { userProfile, viewProfileDetail, setRequestModalState } = useApp();
      const [profiles, setProfiles] = useState([]);

      useEffect(() => {
        try {
          const raw = localStorage.getItem('wetali_profiles');

          const filteredList = list.filter(p => p.id !== userProfile?.id && p.id !== 'current_user');
          setProfiles(filteredList);

          setFiltered(INITIAL_PROFILES);

    // ============================================================
    // COMPONENT: DEMANDES REÇUES & ENVOYÉES
    // ============================================================
    function RequestsPage() {
      const { userProfile, showToast, refreshCounts, openChatWithMatch, viewProfileDetail } = useApp();
      const [tab, setTab] = useState('received');
      const [received, setReceived] = useState([]);
      const [sent, setSent] = useState([]);

      const load = () => {
        try {
          const raw = localStorage.getItem('wetali_requests');
          const all = raw ? JSON.parse(raw) : [];
          setReceived(all.filter(r => r.toUserId === 'current_user' && r.status === 'pending'));
          setSent(all.filter(r => r.fromUserId === 'current_user'));
        } catch (e) { console.error(e); }
      };

      useEffect(() => { load(); }, []);

      const handleAccept = (req) => {
        try {
          const raw = localStorage.getItem('wetali_requests');
          let all = raw ? JSON.parse(raw) : [];
          all = all.map(r => r.id === req.id ? { ...r, status: 'accepted' } : r);
          localStorage.setItem('wetali_requests', JSON.stringify(all));

          // Create Match
          const rawMatches = localStorage.getItem('wetali_matches');
          const matches = rawMatches ? JSON.parse(rawMatches) : [];
          const newMatch = {
            id: `match_${Date.now()}`,
            users: [req.fromUserId, 'current_user'],
            otherUser: req.fromUser,
            createdAt: new Date().toISOString(),
            lastMessage: "Demande acceptée ! Vous pouvez maintenant échanger."
          };
          matches.unshift(newMatch);
          localStorage.setItem('wetali_matches', JSON.stringify(matches));

          showToast(`Match confirmé avec ${req.fromUser.prenom} !`, "success");
          refreshCounts();
          load();
          openChatWithMatch(newMatch);
        } catch (e) {
          showToast("Erreur lors de l'acceptation.", "error");
        }
      };

      const handleReject = (reqId) => {
        try {
          const raw = localStorage.getItem('wetali_requests');
          let all = raw ? JSON.parse(raw) : [];
          all = all.map(r => r.id === reqId ? { ...r, status: 'rejected' } : r);
          localStorage.setItem('wetali_requests', JSON.stringify(all));
          showToast("Demande déclinée.", "info");
          refreshCounts();
          load();
        } catch (e) {
          console.error(e);
        }
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-6 pb-28 space-y-6">
          <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex justify-between items-center">
            <h1 className="font-serif font-bold text-2xl text-[#0A2F4A]">Demandes de Contact</h1>
            <div className="flex bg-[#F0F4F2] p-1 rounded-2xl">
              <button
                onClick={() => setTab('received')}
                className={`px-4 py-2 rounded-xl text-xs font-bold ${tab === 'received' ? 'bg-white text-[#2D8659] shadow' : 'text-slate-600'}`}
              >
                Reçues ({received.length})
              </button>
              <button
                onClick={() => setTab('sent')}
                className={`px-4 py-2 rounded-xl text-xs font-bold ${tab === 'sent' ? 'bg-white text-[#0A2F4A] shadow' : 'text-slate-600'}`}
              >
                Envoyées ({sent.length})
              </button>
            </div>
          </div>

          {tab === 'received' ? (
            received.length === 0 ? (
              <div className="bg-white rounded-3xl p-12 text-center border text-slate-500 text-xs">
                Aucune demande en attente.
              </div>
            ) : (
              <div className="space-y-4">
                {received.map(r => (
                  <div key={r.id} className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm space-y-3">
                    <div className="flex justify-between items-center">
                      <div onClick={() => viewProfileDetail(r.fromUser)} className="flex items-center gap-3 cursor-pointer">
                        <img
                          src={r.fromUser?.photos?.[0] || "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80"}
                          alt={r.fromUser?.prenom}
                          className="w-14 h-14 rounded-2xl object-cover"
                        />
                        <div>
                          <h3 className="font-bold text-base text-[#0A2F4A]">
                            {r.fromUser?.prenom}, {r.fromUser?.age} ans
                          </h3>
                          <p className="text-xs text-slate-500">{r.fromUser?.ville} • {r.fromUser?.profession}</p>
                        </div>
                      </div>

                      <div className="flex gap-2">
                        <button
                          onClick={() => handleReject(r.id)}
                          className="px-3 py-2 rounded-xl border border-slate-300 text-xs font-bold text-slate-600 hover:bg-slate-50"
                        >
                          Refuser
                        </button>
                        <button
                          onClick={() => handleAccept(r)}
                          className="px-4 py-2 rounded-xl bg-[#2D8659] text-white text-xs font-bold hover:bg-[#236c47]"
                        >
                          Accepter
                        </button>
                      </div>
                    </div>

                    <p className="text-xs text-slate-700 bg-slate-50 p-3 rounded-xl italic">
                      "{r.message}"
                    </p>
                  </div>
                ))}
              </div>
            )
          ) : (
            sent.length === 0 ? (
              <div className="bg-white rounded-3xl p-12 text-center border text-slate-500 text-xs">
                Aucune demande envoyée.
              </div>
            ) : (
              <div className="space-y-3">
                {sent.map(r => (
                  <div key={r.id} className="bg-white rounded-3xl p-4 border border-slate-200 text-xs space-y-1">
                    <div className="flex justify-between font-bold text-[#0A2F4A]">
                      <span>Demande envoyée à {r.toUser?.prenom || "Membre"}</span>
                      <span className="text-[#2D8659]">{r.status === 'accepted' ? '✓ Acceptée' : 'En attente...'}</span>
                    </div>
                    <p className="italic text-slate-600">"{r.message}"</p>
                  </div>
                ))}
              </div>
            )
          )}
        </div>
      );
    }

                const photo = partner.photos?.[0] || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80";

                return (
                  <div key={m.id} className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm space-y-3">
                    <div className="flex items-center gap-3">
                      <img src={photo} alt={partner.prenom} className="w-14 h-14 rounded-2xl object-cover" />
                      <div>
                        <h3 className="font-bold text-base text-[#0A2F4A]">{partner.prenom}, {partner.age} ans</h3>
                        <p className="text-xs text-slate-500">{partner.ville} • {partner.profession}</p>
                      </div>
                    </div>

                    <button
                      onClick={() => openChatWithMatch(m)}
                      className="w-full py-2.5 rounded-xl bg-[#0A2F4A] hover:bg-[#2D8659] text-white text-xs font-bold transition-colors"
                    >
                      Ouvrir la conversation
                    </button>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // COMPONENT: CHAT PAGE (REALTIME MESSAGING)
    // ============================================================
    function ChatPage() {
      const { activeMatch, setCurrentView, userProfile } = useApp();
      const partner = activeMatch?.otherUser || INITIAL_PROFILES[0];
      const chatId = activeMatch?.id || 'match_demo_1';

      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const endRef = useRef(null);

      const loadChat = () => {
        const key = `wetali_chat_${chatId}`;
        const raw = localStorage.getItem(key);
        if (raw) {
          setMessages(JSON.parse(raw));
        } else {
          const starter = [
            {
              id: "msg_1",
              senderId: "other",
              text: `Assalamu alaikum ! Ravi(e) d'échanger avec vous sur Wétali.`,
              time: "14:30",
              read: true
            }
          ];
          localStorage.setItem(key, JSON.stringify(starter));
          setMessages(starter);
        }
      };

      useEffect(() => {
        loadChat();
      }, [chatId]);

      useEffect(() => {
        endRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      const handleSend = (e) => {
        if (e) e.preventDefault();
        if (!input.trim()) return;

        const key = `wetali_chat_${chatId}`;
        const newMsg = {
          id: `msg_${Date.now()}`,
          senderId: 'current_user',
          text: input.trim(),
          time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }),
          read: false
        };

        const updated = [...messages, newMsg];
        setMessages(updated);
        localStorage.setItem(key, JSON.stringify(updated));
        setInput('');

        // Simulate read receipt (✓✓) after 2 seconds
        setTimeout(() => {
          const readUpdated = updated.map(m => m.id === newMsg.id ? { ...m, read: true } : m);
          setMessages(readUpdated);
          localStorage.setItem(key, JSON.stringify(readUpdated));
        }, 2000);
      };

      return (
        <div className="max-w-3xl mx-auto px-3 py-4 pb-24 h-[calc(100vh-4.5rem)] flex flex-col">
          
          {/* Header */}
          <div className="bg-white rounded-2xl p-3 border border-slate-200 shadow-sm flex items-center justify-between mb-2">
            <div className="flex items-center gap-3">
              <button onClick={() => setCurrentView('matches')} className="text-xs font-bold text-slate-500">
                ←
              </button>
              <img
                src={partner.photos?.[0] || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80"}
                alt={partner.prenom}
                className="w-10 h-10 rounded-full object-cover"
              />
              <div>
                <h3 className="font-bold text-sm text-[#0A2F4A]">{partner.prenom}</h3>
                <p className="text-[10px] text-slate-500">{partner.ville} • {partner.profession}</p>
              </div>
            </div>
            <span className="text-[10px] text-[#2D8659] bg-[#EAF5EF] px-2 py-0.5 rounded-full font-bold">
              Échange Respectueux
            </span>
          </div>

          {/* Messages */}
          <div className="flex-1 bg-white rounded-3xl p-4 border border-slate-200 overflow-y-auto space-y-3 shadow-inner">
            <div className="bg-[#EAF5EF] p-2.5 rounded-xl text-center text-[11px] text-[#0A2F4A] font-medium">
              🕊️ Les échanges sont encadrés par la charte d'honneur matrimoniale Wétali.
            </div>

            {messages.map(m => {
              const isMe = m.senderId === 'current_user';
              return (
                <div key={m.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                  <div className={`max-w-[80%] p-3 rounded-2xl text-xs ${isMe ? 'bg-[#0A2F4A] text-white' : 'bg-slate-100 text-slate-800'}`}>
                    <p>{m.text}</p>
                    <div className={`flex justify-end gap-1 text-[9px] mt-1 ${isMe ? 'text-[#A0C0D6]' : 'text-slate-400'}`}>
                      <span>{m.time}</span>
                      {isMe && <span>{m.read ? '✓✓' : '✓'}</span>}
                    </div>
                  </div>
                </div>
              );
            })}
            <div ref={endRef} />
          </div>

          {/* Starters */}
          <div className="flex gap-1.5 overflow-x-auto py-2">
            {["Assalamu alaikum wa rahmatullah !", "Comment envisagez-vous le mariage ?", "Discutons de nos valeurs."].map((s, i) => (
              <button
                key={i}
                onClick={() => setInput(s)}
                className="whitespace-nowrap px-3 py-1 rounded-full bg-white text-[11px] text-slate-700 border hover:bg-[#EAF5EF]"
              >
                {s}
              </button>
            ))}
          </div>

          {/* Input */}
          <form onSubmit={handleSend} className="flex gap-2">
            <input
              type="text"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              placeholder="Écrivez votre message..."
              className="flex-1 p-3 rounded-2xl border border-slate-300 text-xs focus:border-[#2D8659] outline-none"
            />
            <button
              type="submit"
              disabled={!input.trim()}
              className="px-5 py-3 rounded-2xl bg-[#2D8659] text-white font-bold text-xs disabled:opacity-50"
            >
              Envoyer
            </button>
          </form>

        </div>
      );
    }

    // ============================================================
    // COMPONENT: SETTINGS & FIREBASE CONFIG
    // ============================================================
    function SettingsPage() {
      const { userProfile, logout, showToast, setCurrentView } = useApp();
      const [isEditing, setIsEditing] = useState(false);
      const [tab, setTab] = useState('profile');

      const [fbConfig, setFbConfig] = useState(() => {
        try {
          const raw = localStorage.getItem('wetali_firebase_config');
          return raw ? JSON.parse(raw) : { apiKey: '', authDomain: '', projectId: '', storageBucket: '' };
        } catch (e) { return {}; }
      });

      const saveFb = (e) => {
        e.preventDefault();
        localStorage.setItem('wetali_firebase_config', JSON.stringify(fbConfig));
        showToast("Configuration Firebase enregistrée !", "success");
      };

      const resetData = () => {
        if (confirm("Réinitialiser les données locales ?")) {
          localStorage.clear();
          window.location.reload();
        }
      };

      if (isEditing) {
        return (
          <div className="max-w-3xl mx-auto px-4 py-6 pb-24 space-y-4">
            <button onClick={() => setIsEditing(false)} className="text-xs font-bold text-[#0A2F4A]">
              ← Annuler
            </button>
            <ProfileCreation isEditing={true} onComplete={() => setIsEditing(false)} />
          </div>
        );
      }

      return (
        <div className="max-w-3xl mx-auto px-4 py-6 pb-28 space-y-6">
          <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex justify-between items-center">
            <h1 className="font-serif font-bold text-2xl text-[#0A2F4A]">Mon Profil & Paramètres</h1>
            <div className="flex bg-[#F0F4F2] p-1 rounded-2xl">
              <button
                onClick={() => setTab('profile')}
                className={`px-4 py-2 rounded-xl text-xs font-bold ${tab === 'profile' ? 'bg-white text-[#2D8659] shadow' : 'text-slate-600'}`}
              >
                Profil
              </button>
              <button
                onClick={() => setTab('firebase')}
                className={`px-4 py-2 rounded-xl text-xs font-bold ${tab === 'firebase' ? 'bg-white text-[#0A2F4A] shadow' : 'text-slate-600'}`}
              >
                Firebase
              </button>
            </div>
          </div>

          {tab === 'profile' ? (
            <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
              <div className="flex items-center gap-4">
                <img
                  src={userProfile?.photos?.[0] || "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=300&q=80"}
                  alt="Moi"
                  className="w-20 h-20 rounded-2xl object-cover border"
                />
                <div>
                  <h2 className="font-serif font-bold text-xl text-[#0A2F4A]">
                    {userProfile?.prenom || "Amadou"}, {userProfile?.age || 29} ans
                  </h2>
                  <p className="text-xs text-slate-500">{userProfile?.ville || "Paris"} • {userProfile?.profession || "Cadre"}</p>
                </div>
              </div>

              <button
                onClick={() => setIsEditing(true)}
                className="w-full py-3 rounded-2xl bg-[#0A2F4A] text-white font-bold text-xs"
              >
                Modifier mon profil complet
              </button>

              <div className="flex gap-3 pt-4 border-t">
                <button
                  onClick={() => { logout(); setCurrentView('home'); }}
                  className="flex-1 py-2.5 rounded-xl border border-slate-300 text-xs font-bold"
                >
                  Se Déconnecter
                </button>
                <button
                  onClick={resetData}
                  className="py-2.5 px-4 rounded-xl border border-rose-300 text-rose-600 text-xs font-bold"
                >
                  Réinitialiser
                </button>
              </div>
            </div>
          ) : (
            <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
              <h2 className="font-bold text-sm text-[#0A2F4A]">Configuration Firebase Console</h2>
              <form onSubmit={saveFb} className="space-y-3">
                <input
                  type="text"
                  placeholder="API Key"
                  value={fbConfig.apiKey || ''}
                  onChange={(e) => setFbConfig({ ...fbConfig, apiKey: e.target.value })}
                  className="w-full p-2.5 rounded-xl border text-xs font-mono"
                />
                <input
                  type="text"
                  placeholder="Auth Domain"
                  value={fbConfig.authDomain || ''}
                  onChange={(e) => setFbConfig({ ...fbConfig, authDomain: e.target.value })}
                  className="w-full p-2.5 rounded-xl border text-xs font-mono"
                />
                <input
                  type="text"
                  placeholder="Project ID"
                  value={fbConfig.projectId || ''}
                  onChange={(e) => setFbConfig({ ...fbConfig, projectId: e.target.value })}
                  className="w-full p-2.5 rounded-xl border text-xs font-mono"
                />
                <button type="submit" className="w-full py-2.5 rounded-xl bg-[#2D8659] text-white text-xs font-bold">
                  Enregistrer les clés Firebase
                </button>
              </form>
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // COMPONENT: SEND REQUEST MODAL
    // ============================================================
    function SendRequestModal() {
      const { requestModalState, setRequestModalState, userProfile, showToast, refreshCounts } = useApp();
      const { isOpen, targetProfile } = requestModalState;
      const [msg, setMsg] = useState("Assalamu alaikum, j'ai vu ton profil et ça m'intéresse. J'aimerais faire ta connaissance.");

      if (!isOpen || !targetProfile) return null;

      const handleSend = (e) => {
        e.preventDefault();
        try {
          const raw = localStorage.getItem('wetali_requests');
          const list = raw ? JSON.parse(raw) : [];
          list.unshift({
            id: `req_${Date.now()}`,
            fromUserId: 'current_user',
            toUserId: targetProfile.id,
            fromUser: userProfile || { prenom: "Amadou", ville: "Paris", photos: ["https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80"] },
            toUser: targetProfile,
            message: msg,
            status: 'pending',
            createdAt: new Date().toISOString()
          });
          localStorage.setItem('wetali_requests', JSON.stringify(list));
          showToast(`Demande envoyée à ${targetProfile.prenom} !`, "success");
          refreshCounts();
          setRequestModalState({ isOpen: false, targetProfile: null });
        } catch (err) {
          showToast("Erreur lors de l'envoi", "error");
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0A2F4A]/80 backdrop-blur-sm">
          <div className="relative w-full max-w-md bg-white rounded-3xl p-6 shadow-2xl space-y-4">
            <div className="flex justify-between items-center border-b pb-3">
              <h3 className="font-bold text-sm text-[#0A2F4A]">Demande de Rencontre d'Honneur</h3>
              <button onClick={() => setRequestModalState({ isOpen: false, targetProfile: null })}>✕</button>
            </div>

            <div className="flex items-center gap-3 bg-slate-50 p-3 rounded-2xl">
              <img src={targetProfile.photos?.[0]} alt={targetProfile.prenom} className="w-12 h-12 rounded-xl object-cover" />
              <div>
                <h4 className="font-bold text-sm text-[#0A2F4A]">{targetProfile.prenom}, {targetProfile.age} ans</h4>
                <p className="text-xs text-slate-500">{targetProfile.ville} • {targetProfile.profession}</p>
              </div>
            </div>

            <form onSubmit={handleSend} className="space-y-3">
              <textarea
                rows={3}
                required
                value={msg}
                onChange={(e) => setMsg(e.target.value)}
                className="w-full p-3 rounded-2xl border text-xs outline-none focus:border-[#2D8659] resize-none"
              />

              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={() => setRequestModalState({ isOpen: false, targetProfile: null })}
                  className="w-1/3 py-2.5 rounded-xl border text-xs font-bold"
                >
                  Annuler
                </button>
                <button
                  type="submit"
                  className="w-2/3 py-2.5 rounded-xl bg-[#2D8659] text-white text-xs font-bold hover:bg-[#236c47]"
                >
                  Envoyer
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ============================================================
    // MAIN APP ROUTER
    // ============================================================
    function MainApp() {
      const { user, userProfile, currentView, toast } = useApp();

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      if (!user) {
        return <AuthPage />;
      }

      if (!userProfile && currentView !== 'profile-create') {
        return (
          <div className="min-h-screen bg-[#F4F7F6]">
            <Header />
            <ProfileCreation />
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#F4F7F6] text-slate-800 font-sans flex flex-col">
          <Header />

          {toast && (
            <div className="fixed top-16 inset-x-4 sm:inset-x-auto sm:right-6 z-50">
              <div className={`px-4 py-2.5 rounded-2xl shadow-xl text-xs font-bold text-white ${toast.type === 'error' ? 'bg-rose-600' : 'bg-[#2D8659]'}`}>
                {toast.message}
              </div>
            </div>
          )}

          <main className="flex-1">
            {currentView === 'home' && <HomePage />}
            {currentView === 'profile-detail' && <ProfileDetailPage />}
            {currentView === 'requests' && <RequestsPage />}
            {currentView === 'matches' && <MatchesPage />}
            {currentView === 'chat' && <ChatPage />}
            {currentView === 'settings' && <SettingsPage />}
            {currentView === 'profile-create' && <ProfileCreation />}
          </main>

          <SendRequestModal />
          <BottomNav />
        </div>
      );
    }

    // Mount React App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <AppProvider>
        <MainApp />
      </AppProvider>
    );
  </script>
</body>
</html>
